<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- g8r: a bare wireframe gator head in profile, mouth closed. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#050d03" stroke="#1a3310" stroke-width="8"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the one construction line: the snout's ridge -->
    <path d="M480 468 L790 482" stroke="#3fa34d" stroke-width="7" stroke-dasharray="2 20"/>
    <!-- head outline: neck, brow over the eye, long snout, nostril bump, jaw -->
    <path stroke="#8ef05a" stroke-width="22"
          d="M205 590 L205 480
             C240 450 285 432 330 428
             C352 392 420 382 455 422
             L790 452
             C822 452 846 470 846 494
             C846 520 824 536 796 538
             L560 580
             C460 606 330 622 240 606
             Z"/>
    <!-- the closed mouth, curling up into a smile at the hinge -->
    <path stroke="#8ef05a" stroke-width="14" d="M808 516 L500 556 C470 560 452 552 440 534"/>
    <!-- two scutes on the neck -->
    <path stroke="#3fa34d" stroke-width="9" d="M238 462 L252 438 L268 454 M282 446 L296 424 L312 438"/>
    <!-- nostril -->
    <circle cx="812" cy="474" r="7" stroke="#3fa34d" stroke-width="7"/>
  </g>
  <!-- the eye -->
  <circle cx="400" cy="440" r="24" fill="none" stroke="#d8ecc8" stroke-width="11"/>
  <circle cx="404" cy="440" r="9" fill="#d8ecc8"/>
</svg>
